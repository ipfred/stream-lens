<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>iframe 播放器</title>
  <style>
    body { margin: 0; padding: 8px; background: #111; color: #ddd; font: 13px -apple-system, 'PingFang SC', sans-serif; }
    video { width: 100%; max-height: 240px; background: #000; }
  </style>
</head>
<body>
  <label>选择本地视频：<input type="file" id="file" accept="video/*"></label>
  <video id="v" controls loop muted playsinline></video>
  <script>
    document.getElementById('file').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var video = document.getElementById('v');
      video.src = URL.createObjectURL(file);
      var p = video.play();
      if (p && p.catch) p.catch(function () { /* use the controls if autoplay is blocked */ });
    });
  </script>
</body>
</html>
